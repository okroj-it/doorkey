<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">doorkey</title>
  <desc id="d">A phone keypad for the front door, and a fingerprint-confirmed trigger for Home Assistant scripts, from one NFC tap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6aa2ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6aa2ff"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="27.5" fill="none" stroke="#252a36"/>

  <!-- the mark: a keyhole inside NFC waves -->
  <g transform="translate(300 180)" fill="none" stroke-linecap="round">
    <g stroke="#6aa2ff" stroke-width="7">
      <path d="M-74 -62 A96 96 0 0 0 -74 62" stroke-opacity=".35"/>
      <path d="M-104 -88 A136 136 0 0 0 -104 88" stroke-opacity=".18"/>
      <path d="M74 -62 A96 96 0 0 1 74 62" stroke-opacity=".35"/>
      <path d="M104 -88 A136 136 0 0 1 104 88" stroke-opacity=".18"/>
    </g>
    <rect x="-58" y="-78" width="116" height="156" rx="30" fill="#1e222c" stroke="#2f3644" stroke-width="2"/>
    <circle cx="0" cy="-14" r="20" fill="url(#accent)"/>
    <path d="M-11 0 L-17 44 H17 L11 0 Z" fill="url(#accent)"/>
  </g>

  <!-- fingerprint, small, bottom-right of the mark -->
  <g transform="translate(372 258) scale(1.6)" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round">
    <circle cx="0" cy="0" r="19" fill="#12141a" stroke="#2c5138"/>
    <g transform="translate(-12 -12)">
      <path d="M12 3a8 8 0 0 0-8 8M12 3a8 8 0 0 1 8 8v1M8.5 20.5A12 12 0 0 0 9 11a3 3 0 0 1 6 0 16 16 0 0 1-1 6M12 11v2a20 20 0 0 1-2 8.5M17.5 19a24 24 0 0 0 .5-6"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="520" y="168" font-size="92" font-weight="700" fill="#eef1f7" letter-spacing="-2">doorkey</text>
    <text x="524" y="218" font-size="27" fill="#8a90a0">Tap a tag. Type a code — or touch the sensor.</text>
    <g font-size="17" font-weight="600" letter-spacing="1.5">
      <rect x="524" y="250" width="176" height="36" rx="18" fill="#6aa2ff" fill-opacity=".12" stroke="#6aa2ff" stroke-opacity=".45"/>
      <text x="612" y="274" text-anchor="middle" fill="#9cc1ff">NTAG 424 DNA</text>
      <rect x="714" y="250" width="138" height="36" rx="18" fill="#4ade80" fill-opacity=".1" stroke="#4ade80" stroke-opacity=".45"/>
      <text x="783" y="274" text-anchor="middle" fill="#86efac">PASSKEYS</text>
      <rect x="866" y="250" width="214" height="36" rx="18" fill="#eef1f7" fill-opacity=".06" stroke="#eef1f7" stroke-opacity=".25"/>
      <text x="973" y="274" text-anchor="middle" fill="#cfd4de">HOME ASSISTANT</text>
    </g>
  </g>
</svg>
