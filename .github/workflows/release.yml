name: Release image

# A version tag (v1.2.3) builds and publishes the multi-arch image
# ghcr.io/okroj-it/doorkey:1.2.3 (also 1.2, latest, sha-<commit>) - the image
# the Home Assistant app installs. Pull requests that touch the image build
# both architectures without pushing, so a broken arm64 build shows up
# before it is merged.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/release.yml
      - package.json
      - bun.lock
      - web/package.json
      - web/bun.lock

permissions:
  contents: read

env:
  IMAGE: ghcr.io/okroj-it/doorkey
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both: no QEMU, so arm64 builds as fast as amd64.
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "$PUBLISH" = true ]; then echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else echo "version=pr-${{ github.event.pull_request.number }}" >>"$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          # Provenance is attested through GitHub in the merge job instead: in
          # the image index it would appear as an extra "unknown" platform.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - if: env.PUBLISH == 'true'
        name: Keep the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Multi-arch image
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Digest of the multi-arch image
        id: index
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)" >>"$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
