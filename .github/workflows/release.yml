name: Release image

# A version tag (v1.2.3) builds and publishes two multi-arch images, tagged
# 1.2.3, 1.2, latest and sha-<commit>:
#   ghcr.io/okroj-it/doorkey      standalone (compose, Kubernetes)
#   ghcr.io/okroj-it/doorkey-app  the Home Assistant app (Dockerfile target app)
# Pull requests that touch the images build both architectures without
# pushing, so a broken arm64 build shows up before it is merged.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - deploy/home-assistant/**
      - .github/workflows/release.yml
      - package.json
      - bun.lock
      - web/package.json
      - web/bun.lock

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/okroj-it
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both: no QEMU, so arm64 builds as fast as amd64.
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "$PUBLISH" = true ]; then echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else echo "version=pr-${{ github.event.pull_request.number }}" >>"$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both images in one job: the app image reuses the standalone build's
      # layers. Provenance is attested through GitHub in the publish job
      # instead: in the image index it would show as an extra "unknown"
      # platform.
      - name: Build doorkey${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: doorkey
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/doorkey,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Build doorkey-app${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: doorkey-app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/doorkey-app,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - if: env.PUBLISH == 'true'
        name: Keep the digests for the publish job
        run: |
          mkdir -p /tmp/digests/doorkey /tmp/digests/doorkey-app
          touch "/tmp/digests/doorkey/${DOORKEY#sha256:}" "/tmp/digests/doorkey-app/${DOORKEY_APP#sha256:}"
        env:
          DOORKEY: ${{ steps.doorkey.outputs.digest }}
          DOORKEY_APP: ${{ steps.doorkey-app.outputs.digest }}
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/
          retention-days: 1

  publish:
    name: publish (${{ matrix.image }})
    needs: build
    if: github.event_name == 'push'
    strategy:
      matrix:
        image: [doorkey, doorkey-app]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/okroj-it/${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Multi-arch image
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Digest of the multi-arch image
        id: index
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)" >>"$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
